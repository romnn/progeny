# Local and CI tooling. The Rust toolchain is deliberately absent: developers provide a
# recent compiler with rustup, CI installs it with `dtolnay/rust-toolchain`, and mise's
# shims would otherwise shadow rustup and break `cargo +nightly` (used by udeps).
[tools]
# Developer tools
task = "latest"
typos = "latest"
actionlint = "latest"
"github:romnn/cooldown" = { version = "latest", minimum_release_age = "0" }
"github:romnn/bumpversion" = { version = "latest", matching = "bumpversion", minimum_release_age = "0" }

# Cross toolchain. cargo-fc lints the Windows and macOS targets from Linux and selects
# cargo-zigbuild for them; without zig it fails with "Failed to find zig".
zig = "latest"
"github:rust-cross/cargo-zigbuild" = "latest"

# Cargo plugins
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
"github:romnn/cargo-feature-combinations" = { version = "latest", matching = "cargo-fc", minimum_release_age = "0" }
"aqua:rustsec/rustsec/cargo-audit" = "latest"
"github:est31/cargo-udeps" = "latest"
"github:romnn/cargo-watchdoc" = { version = "latest", minimum_release_age = "0" }
# The fuzz targets under fuzz/ need nightly and a sanitizer, so this is local-only: soaks run on a
# dev box, and CI gates the corpus instead. No prebuilt backend publishes it.
"cargo:cargo-fuzz" = "latest"

[settings]
lockfile = true
lockfile_platforms = [
  "linux-x64",
  "macos-arm64",
  "windows-x64",
]
