# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-action.json
name: Fetch corpus
description: Restore the fetched conformance corpus, download whatever is missing, and cache it.

inputs:
  pinned:
    description: >-
      Fetch only the pinned documents, verified against their snapshots, as pull requests and
      `main` need. Otherwise fetch every document, live ones included, as the nightly run does.
    default: "true"

runs:
  using: composite
  steps:
    # Pinned documents cannot change, so their cache is keyed by what pins them: the manifest's
    # revs and the snapshots' digests. There is no fallback to an older key, whose bytes could pass
    # for a pin that no longer downloads. The full corpus is refreshed daily, falling back to its
    # last good copy when a publisher is down, under a prefix of its own so it never restores a
    # pinned-only archive.
    - name: Corpus cache key
      id: key
      shell: bash
      run: |
        if [ "${{ inputs.pinned }}" = "true" ]; then
          echo "key=corpus-pinned-${{ hashFiles('corpus/manifest.toml', 'corpus/snapshots/**') }}" >> "$GITHUB_OUTPUT"
          echo "fallback=" >> "$GITHUB_OUTPUT"
        else
          echo "key=corpus-all-${{ hashFiles('corpus/manifest.toml') }}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "fallback=corpus-all-" >> "$GITHUB_OUTPUT"
        fi
    - name: Restore the corpus
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: corpus/cache
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.fallback }}
    # A pinned fetch fails when a document does not match its snapshot, so the save below never
    # stores a wrong one. The full fetch refreshes the live documents on the day's first run and
    # keeps the restored copy of one whose download fails.
    - name: Fetch corpus
      shell: bash
      run: >-
        task corpus:fetch --
        ${{ inputs.pinned == 'true' && '--pinned' || '' }}
        ${{ inputs.pinned != 'true' && steps.cache.outputs.cache-hit != 'true' && '--refresh' || '' }}
    # Saved here rather than by the cache action's own post-job step: the gates that follow this in
    # the corpus jobs take an hour and fail often enough that a save conditioned on the job
    # succeeding would routinely never run.
    - name: Save the corpus
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: corpus/cache
        key: ${{ steps.key.outputs.key }}
