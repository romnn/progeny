# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-action.json
name: Fetch corpus
description: Restore the fetched conformance corpus, download whatever is missing, and cache it.

runs:
  using: composite
  steps:
    # Keyed by day rather than by commit: a run inside the day stays off 77 live vendor endpoints,
    # and the first run of a day downloads all of them again, so a publisher moving under us
    # surfaces within a day instead of never. The manifest hash is in the key too, so editing
    # corpus/manifest.toml refetches immediately rather than at midnight.
    - name: Corpus cache key
      id: key
      shell: bash
      run: >-
        echo "key=corpus-${{ hashFiles('corpus/manifest.toml') }}-$(date -u +%Y-%m-%d)"
        >> "$GITHUB_OUTPUT"
    # A day's first run falls back to the most recent earlier corpus, so a document whose publisher
    # is down or has moved keeps its last good copy instead of failing every run until the manifest
    # catches up.
    - name: Restore the corpus
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: corpus/cache
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          corpus-${{ hashFiles('corpus/manifest.toml') }}-
          corpus-
    # Without today's exact copy every document is downloaded again, and a failed download keeps
    # the restored copy and is reported as a warning.
    # With it, only what the restore did not supply is downloaded, so a partial cache still
    # converges.
    - name: Fetch corpus
      shell: bash
      run: task corpus:fetch -- ${{ steps.cache.outputs.cache-hit != 'true' && '--refresh' || '' }}
    # Saved here rather than by the cache action's own post-job step: the gates that follow this in
    # the corpus jobs take an hour and fail often enough that a save conditioned on the job
    # succeeding would routinely never run.
    - name: Save the corpus
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: corpus/cache
        key: ${{ steps.key.outputs.key }}
