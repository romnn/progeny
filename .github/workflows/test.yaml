# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: test
on:
  push: {}
  workflow_call: {}
  pull_request:
    types: [opened, synchronize, reopened, edited]

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache: true
          env: false
      - run: >-
          mise install task aqua:nextest-rs/nextest/cargo-nextest
          github:romnn/cargo-feature-combinations
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Feature-combination tests
        run: task test:fc
      - name: Doc-tests
        run: task test:doc

  corpus:
    name: conformance corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache: true
          env: false
      - run: mise install task
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Vendor specs are not committed (~117 MB, redistribution rights vary), so the
      # corpus is fetched from corpus/manifest.toml. `launchdarkly` has no cached copy
      # and comes from a live vendor endpoint; the runner treats a fetch failure there as
      # infrastructure rather than a gate.
      - name: Fetch corpus
        run: task corpus:fetch
      # Round-trip, reference resolution, dialect convergence, generation, determinism and the
      # diagnostics snapshots, for all 78.
      - name: Run the corpus
        run: task corpus
      # Compiling 78 generated crates is minutes-to-hours, so pull requests compile the reviewed
      # 8-document tier and the full matrix is a deliberate, on-demand run.
      # This lints them too, with warnings denied: a warning in generated code is a defect its
      # consumer meets in their own build, about source they did not write.
      - name: Compile and lint the generated crates for the quick tier
        run: task corpus:compile
      - name: Differential serde harness
        run: task differential

  publish:
    name: publish (dry-run)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Publish crates (dry-run)
        uses: romnn/publish-crates@main
        with:
          dry-run: true
          resolve-versions: true
