# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: lint
on:
  # A branch is checked through its pull request, so only `main` runs on push; a branch with a pull
  # request would otherwise run every job twice for one commit.
  push:
    branches: [main]
  # `edited` checks a pull request retargeted onto a new base, as a stacked one is when the one below
  # it merges. Every job skips the other edits, to a title or a body.
  pull_request:
    types: [opened, synchronize, reopened, edited]

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "0"

jobs:
  lint:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: true
          env: false
      - run: >-
          mise install task zig github:romnn/cargo-feature-combinations
          aqua:rustsec/rustsec/cargo-audit github:est31/cargo-udeps
          github:rust-cross/cargo-zigbuild
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Audit
        continue-on-error: true
        run: task audit
      - name: Check for unused dependencies
        run: task unused-dependencies
      - name: Lint (all feature combinations × targets)
        run: task lint:fc

  spellcheck:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: true
          env: false
      - run: mise install task typos
      - name: Spellcheck
        run: task spellcheck
