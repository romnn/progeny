# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: build
on:
  # A branch is checked through its pull request, so only `main` runs on push; a branch with a pull
  # request would otherwise run every job twice for one commit.
  push:
    branches: [main]
  # `edited` checks a pull request retargeted onto a new base, as a stacked one is when the one below
  # it merges. Every job skips the other edits, to a title or a body.
  pull_request:
    types: [opened, synchronize, reopened, edited]

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "0"

jobs:
  goreleaser:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: true
          env: false
      - run: mise install task
      - name: Release (dry-run)
        run: task build:goreleaser
