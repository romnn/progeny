# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: build
on:
  # A branch is checked through its pull request, so only `main` runs on push; a branch with a pull
  # request would otherwise run every job twice for one commit.
  push:
    branches: [main]
  # No `edited`: a description edit would have to skip its jobs, and a skipped job takes the place
  # of the real result for the same commit in the pull request's checks. Without it a retargeted
  # pull request is not rechecked until its next push.
  pull_request:
    types: [opened, synchronize, reopened]

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "0"

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: true
          env: false
      - run: mise install task
      - name: Release (dry-run)
        run: task build:goreleaser
