# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: bench
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Every commit is a point in the history, so pending runs queue in order rather than replacing each
# other, and none is cancelled.
concurrency:
  group: bench
  cancel-in-progress: false
  queue: max

jobs:
  compile-cost:
    name: generated-crate compile cost
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The history lives on `gh-pages`, which this job commits to.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The two vendor documents at fixed upstream commits, rather than the corpus's daily fetch of
      # their moving branches, so a step in the chart is a change in progeny or its toolchain.
      # Moving a pin is a deliberate commit here, which the history then shows as one.
      - name: Fetch the pinned documents
        run: |
          mkdir -p corpus/cache
          curl -fsSL -o corpus/cache/oxide.json \
            https://raw.githubusercontent.com/oxidecomputer/oxide.rs/ed6b8352db6e1a4c97e13672254fc4646cb47458/oxide.json
          curl -fsSL -o corpus/cache/okta.yaml \
            https://raw.githubusercontent.com/okta/okta-management-openapi-spec/2bc3a3631fef54cab7aaa97fbaf053f2069cb311/dist/current/management-minimal.yaml
      # Three documents from the quick tier, small to large: `petstore-31` is the fixed cost of a
      # generated crate, `oxide` a typical API, and `okta` a discriminator-heavy one.
      # The hand-written serde strategy is measured because it is what the default configuration
      # generates.
      # CPU time and peak RSS at one compiler job are the figures a shared runner holds steady;
      # its load gating and discarding of crowded repetitions apply here as they do locally.
      - name: Measure
        run: >-
          cargo run -p xtask --release -- bench-compile petstore-31 oxide okta
          --hand-written --reps 3 --max-wait 5 --json target/bench-compile.json
      # Runner hardware varies between runs, so only a large move is an alert; the chart shows the
      # rest.
      # The history is committed to `bench/data.js` on `gh-pages`, which must exist.
      - name: Record the history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Generated-crate compile cost
          tool: customSmallerIsBetter
          output-file-path: target/bench-compile.json
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

  # A push made with `GITHUB_TOKEN` does not start a branch-based Pages build, so `gh-pages` is
  # deployed here, and Pages is set to publish from Actions.
  # The chart is at `/bench/`; a docs site deployed by Actions later can copy that directory into
  # its own `static/bench/` and keep the URL.
  deploy:
    name: deploy the chart
    needs: compile-cost
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # The benchtrail release that draws the chart, and its archive's checksum.
      # Moving to another release changes both.
      BENCHTRAIL_VERSION: v0.1.0
      BENCHTRAIL_SHA256: fa0c19f0bd3fe8b3bec576fce9ba837019bc103294666f16217fea4da4e468e2
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/benchtrail.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
      # The page is replaced on every deploy, so `gh-pages` holds only the history, and the chart
      # follows the release pinned above rather than whatever page was committed beside the data.
      - name: Install benchtrail
        run: |
          curl -fsSL -o "$RUNNER_TEMP/benchtrail.zip" \
            "https://github.com/romnn/benchtrail/releases/download/$BENCHTRAIL_VERSION/benchtrail.zip"
          echo "$BENCHTRAIL_SHA256  $RUNNER_TEMP/benchtrail.zip" | sha256sum --check --strict
          unzip -oq "$RUNNER_TEMP/benchtrail.zip" -d pages/bench
      # The page reads its settings from a JSON block in its own markup, so the block is replaced
      # with `.github/benchtrail.json`.
      # Escaping `</` keeps a setting from closing the script element early.
      - name: Apply the chart settings
        shell: python
        run: |
          import json, pathlib, re, sys

          settings = json.loads(pathlib.Path(".github/benchtrail.json").read_text())
          block = json.dumps(settings, indent=2).replace("</", "<\\/")
          page = pathlib.Path("pages/bench/index.html")
          html, count = re.subn(
              r'(<script id="benchtrail-config" type="application/json">).*?(</script>)',
              lambda match: f"{match[1]}\n{block}\n{match[2]}",
              page.read_text(),
              flags=re.S,
          )
          if count != 1:
              sys.exit(f"{page} holds {count} settings blocks rather than one")
          page.write_text(html)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
