# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: bench
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Every commit is a point in the history, so pending runs queue in order rather than replacing each
# other, and none is cancelled.
concurrency:
  group: bench
  cancel-in-progress: false
  queue: max

jobs:
  compile-cost:
    name: generated-crate compile cost
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The history lives on `gh-pages`, which this job commits to.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # An exact release rather than `stable`: every compiler release moves every figure, so moving
      # it is a commit here, and the new release starts a new segment of the history.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The two vendor documents at fixed upstream commits, rather than the corpus's daily fetch of
      # their moving branches, so a step in the chart is a change in progeny or its toolchain.
      # Moving a pin is a deliberate commit here, which the history then shows as one.
      - name: Fetch the pinned documents
        run: |
          mkdir -p corpus/cache
          curl -fsSL -o corpus/cache/oxide.json \
            https://raw.githubusercontent.com/oxidecomputer/oxide.rs/ed6b8352db6e1a4c97e13672254fc4646cb47458/oxide.json
          curl -fsSL -o corpus/cache/okta.yaml \
            https://raw.githubusercontent.com/okta/okta-management-openapi-spec/2bc3a3631fef54cab7aaa97fbaf053f2069cb311/dist/current/management-minimal.yaml
      # valgrind's exact Ubuntu 24.04 package, from the release pocket that keeps it: a new valgrind
      # may count differently, so moving it is a commit here, and its version is recorded with every
      # figure it takes.
      - name: Install valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends valgrind=1:3.22.0-0ubuntu3
      # Three documents from the quick tier, small to large: `petstore-31` is the fixed cost of a
      # generated crate, `oxide` a typical API, and `okta` a discriminator-heavy one.
      # The hand-written serde strategy is measured because it is what the default configuration
      # generates.
      # CPU time and peak RSS at one compiler job are timed natively, with the same load gating and
      # discarding of crowded repetitions as locally, and each CPU time records the runner's
      # processor.
      # One compile of each is then profiled under valgrind, whose instructions and heap no runner
      # processor changes.
      - name: Measure
        run: >-
          cargo run -p xtask --release -- bench-compile petstore-31 oxide okta
          --hand-written --reps 3 --max-wait 5 --valgrind valgrind --json target/bench-compile.json
      # No threshold alert: github-action-benchmark compares each run with the previous one,
      # whatever processor each ran on. benchtrail's change detection, which compares a CPU time
      # only with earlier ones from the same processor model, marks regressions on the dashboard.
      # The history is committed to `bench/data.js` on `gh-pages`, which must exist.
      - name: Record the history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Generated-crate compile cost
          tool: customSmallerIsBetter
          output-file-path: target/bench-compile.json
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true

  # The pages workflow builds the documentation and installs the benchtrail dashboard, with the
  # history this run recorded, at `/bench/`.
  # It deploys even when the benchmark failed, so a failed measurement never holds back the
  # documentation of the commit.
  deploy:
    name: deploy the site
    needs: compile-cost
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
