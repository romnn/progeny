[package]
name = "xtask"
description = "Reproducible workflows for progeny: the conformance corpus, the compile-cost benchmark, the module-layer lint"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
camino.workspace = true
clap.workspace = true
proc-macro2.workspace = true
progeny = { workspace = true, features = ["harness"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn.workspace = true
toml.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
# `getrusage` is how the compile benchmark reads CPU time and peak resident set size of a
# child. There is no portable equivalent, so the benchmark says so on other platforms rather
# than reporting a number it cannot measure.
nix.workspace = true

[lints]
workspace = true
