[package]
name = "xtask"
description = "Reproducible workflows for progeny: the conformance corpus, the compile-cost benchmark, the module-layer lint"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
backon.workspace = true
camino.workspace = true
clap.workspace = true
color-eyre.workspace = true
flate2.workspace = true
indoc.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
progeny = { workspace = true, features = ["harness", "exact-numbers"] }
quote.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn.workspace = true
toml.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
# `getrusage` is how the compile benchmark reads CPU time and peak resident set size of a
# child. There is no portable equivalent, so the benchmark says so on other platforms rather
# than reporting a number it cannot measure.
nix.workspace = true

[dev-dependencies]
# `raw_value`, because the payload comparison walks JSON text without parsing its numbers.
# Only xtask's tests compile the comparison, and the feature changes how a `Value` reads an object
# keyed by `serde_json`'s private raw-value marker, so the gates' own build goes without it.
serde_json = { workspace = true, features = ["raw_value"] }
test-util.workspace = true

[lints]
workspace = true
