[package]
name = "progeny-fuzz"
description = "Fuzz targets for progeny's front end"
publish = false
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

# Its own workspace: cargo-fuzz builds with nightly flags and a sanitizer, and folding this into
# the main workspace would put those on every ordinary build. That also means it cannot inherit
# the workspace's package fields or lints, so they are spelled out.
[workspace]

[lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
progeny = { path = "../crates/progeny", features = ["harness"] }
# The generation target asserts that what comes out parses as Rust, which needs a parser.
syn = { version = "2", features = ["full", "parsing"] }

[[bin]]
name = "front_end"
path = "fuzz_targets/front_end.rs"
test = false
doc = false
bench = false

[[bin]]
name = "round_trip"
path = "fuzz_targets/round_trip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolution"
path = "fuzz_targets/resolution.rs"
test = false
doc = false
bench = false

[[bin]]
name = "generate"
path = "fuzz_targets/generate.rs"
test = false
doc = false
bench = false
