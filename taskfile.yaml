# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  ZIGBUILD_IMAGE: ghcr.io/rust-cross/cargo-zigbuild:latest
  GORELEASER_VERSION: "2.17.0"

tasks:
  default:
    cmds:
      - task: check

  build:
    desc: "build in debug mode"
    cmds:
      - cargo build --all-targets {{.CLI_ARGS}}

  build:fc:
    desc: "build in debug mode for all combinations of features"
    cmds:
      - cargo fc build --all-targets {{.CLI_ARGS}}

  build:release:
    desc: "build in release mode"
    cmds:
      - cargo build --all-targets --release {{.CLI_ARGS}}

  goreleaser:
    internal: true
    requires:
      vars: [GORELEASER_ARGS]
    cmds:
      # The image provides Rust, zig, cargo-zigbuild and the release targets; only GoReleaser is missing.
      # The bind-mounted checkout needs safe.directory, and build outputs must retain host ownership.
      - >-
          docker run --rm -e GITHUB_TOKEN -e TAP_GITHUB_TOKEN -e "HOST_UID=$(id -u)" -e
          "HOST_GID=$(id -g)" -v "${PWD}:/workspace" -w /workspace {{.ZIGBUILD_IMAGE}} bash
          -euo pipefail -c ' fix_perms() { for d in target goreleaser-dist; do [ -e "$d" ] &&
          chown -R "${HOST_UID}:${HOST_GID}" "$d" || true; done; }; trap fix_perms EXIT; case
          "$(uname -m)" in x86_64) arch=x86_64 ;; aarch64|arm64) arch=arm64 ;; *) echo
          "unsupported arch" >&2; exit 1 ;; esac; curl -sSfL
          "https://github.com/goreleaser/goreleaser/releases/download/v{{.GORELEASER_VERSION}}/goreleaser_Linux_${arch}.tar.gz"
          | tar -xz -C /usr/local/bin goreleaser; git config --global --add safe.directory
          "$(pwd)"; goreleaser {{.GORELEASER_ARGS}}'

  build:goreleaser:
    desc: "build in release mode using goreleaser"
    cmds:
      - task: goreleaser
        vars: { GORELEASER_ARGS: "build --snapshot --clean" }

  release:
    desc: "release using goreleaser"
    cmds:
      - task: goreleaser
        vars: { GORELEASER_ARGS: "release --clean" }

  check:
    desc: "check cargo workspace"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo check --workspace --all-targets {{.CLI_ARGS}}

  check:fc:
    desc: "check cargo workspace for all combinations of features"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo fc check --all-targets {{.CLI_ARGS}}

  clean:
    desc: "clean cargo workspace"
    cmds:
      - cargo clean {{.CLI_ARGS}}

  corpus:
    desc: "run the conformance corpus (round-trip over every cached spec)"
    cmds:
      - cargo run -p xtask --release -- corpus {{.CLI_ARGS}}

  corpus:fetch:
    desc: "download every corpus spec listed in corpus/manifest.toml into corpus/cache"
    cmds:
      - cargo run -p xtask --release -- corpus --fetch {{.CLI_ARGS}}

  corpus:compile:
    desc: "generate a workspace per quick-tier document, compile it and lint it"
    # `--clippy` denies warnings in the *generated* crates, which `cargo check` does not: a
    # generated warning is a product defect its consumer sees in their own build, about code they
    # did not write. Without it this gate reported "check clean" over four classes of them.
    cmds:
      - cargo run -p xtask --release -- corpus --quick --compile --clippy --packaging workspace {{.CLI_ARGS}}

  corpus:compile:all:
    desc: "the same, over all 78 documents; hours, not minutes"
    # The tier is 8 documents and the corpus is 78, so a shape that occurs once is a shape the
    # tier is blind to. `weather-gov` is the standing example: 1 document, 2 operations, a client
    # that did not compile for a whole stage, found by an unrelated errand rather than by a gate.
    cmds:
      - cargo run -p xtask --release -- corpus --compile --clippy --packaging workspace {{.CLI_ARGS}}

  corpus:snapshots:
    desc: "re-record every document's diagnostics snapshot (read the diff first)"
    cmds:
      - cargo run -p xtask --release -- regen-snapshots {{.CLI_ARGS}}

  corpus:stats:
    desc: "query the parsed corpus (the model-level histograms behind the open questions)"
    cmds:
      - cargo run -p xtask --release -- corpus --stats {{.CLI_ARGS}}

  payloads:
    desc: "round-trip every example payload in the corpus through the generated types"
    cmds:
      - cargo run -p xtask --release -- payloads {{.CLI_ARGS}}

  example:
    desc: "run the generated client against the generated server of one description"
    # The only gate that sends a request. Every other one checks a document, or source, or a body;
    # whether `send()` builds the URL, query string, headers and cookies the description asks for
    # was checked by reading the emitted source until this existed.
    cmds:
      - cargo run -p xtask --release -- example {{.CLI_ARGS}}

  probe:
    desc: "the wire differential: every servable operation of the tier, client against server"
    # The generated form of `task example`, for any document. On its first three documents it found
    # a server that panicked at startup (the classifier modelled axum's router sharding wrongly),
    # arrays unreadable from a query string (the row alone cannot say whether `ids=a,b` is an
    # array), and HEAD responses being decoded (HTTP strips those bodies).
    cmds:
      - cargo run -p xtask --release -- probe {{.CLI_ARGS}}

  differential:
    desc: "assert the derive and the hand-written serde path agree on every case"
    cmds:
      - cargo run -p xtask --release -- differential {{.CLI_ARGS}}

  bodies:
    desc: "count function bodies per type, derive against hand-written; needs nightly"
    cmds:
      - cargo run -p xtask --release -- differential --bodies {{.CLI_ARGS}}

  bench:compile:
    desc: "A/B the generated-crate cargo check cost (CPU + peak RSS); needs an idle machine"
    cmds:
      - cargo run -p xtask --release -- bench-compile {{.CLI_ARGS}}

  bench:runtime:
    desc: "A/B generated serde over the tier payloads (time + allocations + peak heap)"
    cmds:
      - cargo run -p xtask --release -- bench-runtime {{.CLI_ARGS}}

  docs:
    desc: "open the rustdoc API documentation preview"
    env:
      RUSTDOCFLAGS: "--cfg docsrs"
    cmds:
      - cargo +nightly watchdoc --all-features {{.CLI_ARGS}}

  format:
    desc: "format cargo workspace"
    cmds:
      - cargo fmt --all {{.CLI_ARGS}}

  test:
    desc: "test cargo workspace (unit only; nextest default profile)"
    aliases: [test:unit]
    cmds:
      - cargo nextest run -P default --workspace --all-targets --no-tests "warn" {{.CLI_ARGS}}

  test:fc:
    desc: "test cargo workspace for all combinations of features"
    cmds:
      - cargo fc nextest run -P default --all-targets --no-tests "warn" {{.CLI_ARGS}}

  test:integration:
    desc: "run the integration tests (nextest integration profile)"
    cmds:
      - cargo nextest run -P integration --workspace --all-targets --no-tests "warn" {{.CLI_ARGS}}

  test:all:
    desc: "run the full suite (nextest ci profile)"
    aliases: [test:ci]
    cmds:
      - cargo nextest run -P ci --workspace --all-targets --no-tests "warn" {{.CLI_ARGS}}

  test:doc:
    desc: "run doctests in cargo workspace"
    cmds:
      - cargo test --doc --workspace {{.CLI_ARGS}}

  # cargo-fuzz defaults `--target` to the triple its own binary was built for.
  # A prebuilt download can be a static musl binary, and the address sanitizer cannot run against
  # static musl, so these tasks pass the nightly compiler's host triple instead.
  fuzz:
    desc: "soak a fuzz target (front_end or round_trip); needs nightly + cargo-fuzz"
    dir: "{{.ROOT_DIR}}/fuzz"
    interactive: true
    vars:
      HOST:
        sh: "rustc +nightly -vV | sed -n 's/^host: //p'"
    cmds:
      - cargo +nightly fuzz run --target {{.HOST}} {{.CLI_ARGS}}

  fuzz:build:
    desc: "build every fuzz target with the sanitizer"
    dir: "{{.ROOT_DIR}}/fuzz"
    vars:
      HOST:
        sh: "rustc +nightly -vV | sed -n 's/^host: //p'"
    cmds:
      - cargo +nightly fuzz build --target {{.HOST}} {{.CLI_ARGS}}

  fuzz:lint:
    desc: "lint the fuzz targets"
    dir: "{{.ROOT_DIR}}/fuzz"
    cmds:
      - cargo +nightly clippy --all-targets --no-deps {{.CLI_ARGS}}

  # libFuzzer writes new inputs into the first corpus directory only, so the committed regression
  # inputs seed the run without being changed by it.
  fuzz:smoke:
    desc: "fuzz every target briefly (FUZZ_SECONDS each, default 30), seeded with the regressions"
    dir: "{{.ROOT_DIR}}/fuzz"
    vars:
      HOST:
        sh: "rustc +nightly -vV | sed -n 's/^host: //p'"
      TARGETS:
        sh: cargo +nightly fuzz list
      SECONDS: '{{.FUZZ_SECONDS | default "30"}}'
    cmds:
      - for: { var: TARGETS }
        cmd: >-
          mkdir -p corpus/{{.ITEM}} &&
          cargo +nightly fuzz run --target {{.HOST}} {{.ITEM}} corpus/{{.ITEM}} regressions/{{.ITEM}}
          -- -max_total_time={{.SECONDS}}

  # `fuzz/regressions/<target>` is committed: a minimal edge-covering set of each target's inputs,
  # plus any crash input worth keeping fixed.
  # `-runs=0` executes every input once and fuzzes nothing, so this is deterministic.
  fuzz:regressions:
    desc: "replay the committed regression inputs through every fuzz target"
    dir: "{{.ROOT_DIR}}/fuzz"
    vars:
      HOST:
        sh: "rustc +nightly -vV | sed -n 's/^host: //p'"
      TARGETS:
        sh: cargo +nightly fuzz list
    cmds:
      - for: { var: TARGETS }
        cmd: cargo +nightly fuzz run --target {{.HOST}} {{.ITEM}} regressions/{{.ITEM}} -- -runs=0

  # Counting edges rather than hit-count buckets keeps the set small: about 360 inputs a target
  # instead of thousands, with the same edge coverage.
  fuzz:regressions:merge:
    desc: "fold inputs that reach new edges from the local corpus into the regression sets"
    dir: "{{.ROOT_DIR}}/fuzz"
    vars:
      HOST:
        sh: "rustc +nightly -vV | sed -n 's/^host: //p'"
      TARGETS:
        sh: cargo +nightly fuzz list
    cmds:
      - for: { var: TARGETS }
        cmd: >-
          mkdir -p regressions/{{.ITEM}} &&
          cargo +nightly fuzz run --target {{.HOST}} {{.ITEM}} regressions/{{.ITEM}} corpus/{{.ITEM}}
          -- -set_cover_merge=1 -use_counters=0 -use_value_profile=0

  fuzz:list:
    desc: "list the fuzz targets"
    dir: "{{.ROOT_DIR}}/fuzz"
    cmds:
      - cargo +nightly fuzz list

  lint:layers:
    desc: "check that the pipeline module graph only ever points leftward"
    cmds:
      - cargo run -p xtask --release -- lint-layers {{.CLI_ARGS}}

  lint:
    desc: "lint cargo workspace"
    cmds:
      - cargo lint --workspace --all-features {{.CLI_ARGS}}
      - task: lint:layers

  lint:fc:
    desc: "lint every feature combination across all configured targets (the lint gate)"
    cmds:
      - cargo fc lint {{.CLI_ARGS}}
      - task: lint:layers

  lint:fix:
    desc: "lint and fix cargo workspace"
    aliases: [fix]
    cmds:
      - cargo fixit --workspace --all-features {{.CLI_ARGS}}
      - task: lint:layers

  lint:actions:
    desc: "lint github actions"
    cmds:
      - actionlint

  audit:
    desc: "audit cargo workspace dependencies"
    cmds:
      - cargo audit {{.CLI_ARGS}}

  unused:
    desc: "check for unused cargo workspace dependencies"
    aliases: [unused-dependencies]
    cmds:
      - cargo +nightly fc udeps --maximal-features --all-targets {{.CLI_ARGS}}

  typos:
    desc: "check repository for typos"
    aliases: [spellcheck]
    cmds:
      - typos

  outdated:
    desc: "list outdated deps (incl. new majors): adoptable now vs still in cooldown"
    cmds:
      - cooldown outdated --sync {{.CLI_ARGS}}

  outdated:minor:
    desc: "list outdated deps within the current major only"
    cmds:
      - cooldown outdated --no-major --sync {{.CLI_ARGS}}

  upgrade:
    desc: "upgrade all deps incl. cross-major bumps, within the cooldown"
    aliases: [update]
    cmds:
      - cooldown upgrade --major --sync {{.CLI_ARGS}}

  upgrade:minor:
    desc: "upgrade all deps within their current major, within the cooldown"
    cmds:
      - cooldown upgrade --no-major --sync {{.CLI_ARGS}}

  upgrade:latest:
    desc: "upgrade ignoring the cooldown window — use deliberately"
    prompt:
      - "DANGER: this bypasses the supply-chain cooldown and adopts brand-new (possibly compromised) releases. Prefer 'task upgrade' / 'task upgrade:minor'. Continue?"
    cmds:
      - cooldown upgrade --latest {{.CLI_ARGS}}
