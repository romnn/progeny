[tool.bumpversion]
current_version = "0.0.5"
commit = true
tag = true
pre_commit_hooks = [
  # Refresh workspace package versions without updating dependencies.
  "cargo metadata --offline --format-version 1 >/dev/null",
  # fuzz/ is its own workspace and locks progeny through a path dependency, so a bump would leave
  # its lockfile on the old version, which `cargo fuzz` and cooldown both reject.
  "cargo metadata --offline --format-version 1 --manifest-path fuzz/Cargo.toml >/dev/null",
]
additional_files = [
  "Cargo.lock",
  "fuzz/Cargo.lock",
]

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "README.md"
search = "progeny = \"{current_version}\""
replace = "progeny = \"{new_version}\""
