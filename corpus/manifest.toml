# progeny conformance corpus — provenance manifest
#
# 78 real-world OpenAPI documents, plus hermetic fixtures that each pin a generated
# crate shape a real document is too large to stand in for. Vendor specs are NOT
# committed: they total ~117 MB and their redistribution rights vary by publisher.
# `cargo xtask corpus --fetch` downloads each `url` into `corpus/cache/`
# (gitignored); only this manifest and specs marked `local = true` live in git.
# A committed spec that cannot be read fails every corpus run, selected or not.
# Pull requests and `main` run only pinned specs, committed or fetched at a `rev`, so a
# publisher cannot change their result; the others run nightly. Moving a pin is editing
# `rev` and re-recording the spec's snapshot with `task corpus:snapshots`.
#
# Fields:
#   url          upstream source; absent for local specs
#   rev          the commit a raw.githubusercontent.com spec is fetched at, in place of
#                the branch its url names; must match the digest in its snapshot
#   file         filename in corpus/cache/ (or corpus/specs/ when local)
#   local        committed in-tree, hermetic, safe for PR-time CI
#   mock         spec exercises the mock/test-double path
#   schema_docs  keep full JSON-schema doc blocks for this spec
#   bad_examples schema names whose spec examples contradict their own schema;
#                excluded from payload round-trips (a vendor bug, not ours)
#   notes        why this spec is in the corpus / what it stresses
# Imported from the predecessor corpus on 2026-07-26.

