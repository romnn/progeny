# progeny conformance corpus — provenance manifest
#
# 78 real-world OpenAPI documents. Vendor specs are NOT committed: they total
# ~117 MB and their redistribution rights vary by publisher. `cargo xtask corpus
# --fetch` downloads each `url` into `corpus/cache/` (gitignored); only this
# manifest and specs marked `local = true` live in git.
#
# Fields:
#   url          upstream source; absent for local specs
#   file         filename in corpus/cache/ (or corpus/specs/ when local)
#   local        committed in-tree, hermetic, safe for PR-time CI
#   mock         spec exercises the mock/test-double path
#   schema_docs  keep full JSON-schema doc blocks for this spec
#   bad_examples schema names whose spec examples contradict their own schema;
#                excluded from payload round-trips (a vendor bug, not ours)
#   notes        why this spec is in the corpus / what it stresses
# Imported from the predecessor corpus on 2026-07-26.

