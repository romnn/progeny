# The other half of the pair with `dialects.3.0.yaml`: the same API, written in 3.1 by hand.
# Hand-written rather than generated, so that it is an independent statement of what the
# normalization is supposed to mean rather than a recording of what it currently does.
openapi: 3.1.0
info:
  title: Convergence
  version: "1.0"
paths:
  /widgets:
    post:
      operationId: createWidget
      parameters:
        - name: dry
          in: query
          schema:
            type: [boolean, "null"]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Widget"
          multipart/form-data:
            schema:
              type: object
              properties:
                upload:
                  type: string
                  contentMediaType: application/octet-stream
                notes:
                  type: string
      responses:
        "200":
          description: made one
          headers:
            X-Rate-Limit:
              schema:
                type: integer
                exclusiveMinimum: 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
              example:
                nullable: true
                format: binary
                exclusiveMinimum: true
components:
  schemas:
    Widget:
      type: object
      required: [name]
      properties:
        name:
          type: string
          examples: [a widget]
        colour:
          type: [string, "null"]
          enum: [red, green, null]
        size:
          type: integer
          exclusiveMaximum: 100
        blob:
          type: string
          contentEncoding: base64
        parent:
          $ref: "#/components/schemas/Widget"
        nullable:
          type: boolean
        # The same union, spelled the way 3.1 spells a null arm.
        tag:
          anyOf:
            - $ref: "#/components/schemas/Named"
            - type: "null"
        source:
          oneOf:
            - $ref: "#/components/schemas/FromFile"
            - $ref: "#/components/schemas/FromUrl"
          discriminator:
            propertyName: kind
            mapping:
              file: "#/components/schemas/FromFile"
              url: FromUrl
      default:
        nullable: true
        example: 1
    Named:
      type: object
      properties:
        label:
          type: string
    FromFile:
      type: object
      required: [kind, location]
      properties:
        kind:
          type: string
        location:
          type: string
    FromUrl:
      type: object
      required: [kind, location]
      properties:
        kind:
          type: string
        location:
          type: string
