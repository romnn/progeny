# The quick tier: the specs every pull request exercises in full.
#
# Model-level checks (round-trip, convergence, diagnostics snapshots, determinism) run over
# every spec on every run because they are cheap. Compile-checking a generated crate is
# not cheap, so the expensive per-spec assertions run over this list on pull requests and
# over the whole corpus nightly and before a release. Nothing is sampled silently: the
# corpus runner prints what the tier skipped.
#
# Every member is pinned, committed or fetched at a recorded commit, so a publisher cannot change
# a pull request's result; live documents run in the nightly full corpus. Chosen from `notes` in
# manifest.toml so the eight cover both dialects, both serialization formats, and the constructs
# that break generators:
#
#   petstore-31   hermetic and committed — the one spec that needs no network
#   github-31     3.1, ~4 MB, the size ceiling
#   airflow       3.1, 639 anyOf, prefixItems, 626 null-type lines
#   cloudflare    3.0, very large, 29 self-contradicting example payloads
#   okta          3.0 YAML, 56 discriminators
#   lithic        3.1, 99 oneOf, 86 const, patternProperties
#   influxdb      3.0 YAML, binary bodies
#   oxide         3.0, the predecessor's flagship consumer spec — regression protection
#
# Deliberately absent: `zendesk`, whose bare `=` scalar (a YAML 1.1 `!!value` tag) is
# covered by a loader unit test rather than by paying for a large spec, and `launchdarkly`,
# which is fetched live and can fail for reasons unrelated to progeny.
#
# The former derive hole is closed by Workspace packaging. As one crate Cloudflare's derive
# rendering has a 14.7 GiB pressured floor, too large for a hosted runner. Split into types,
# client, and server, the largest measured member is 9.19 GiB. CI therefore compiles all
# eight documents through both serde strategies without an exclusion.
quick = [
  "petstore-31",
  "github-31",
  "airflow",
  "cloudflare",
  "okta",
  "lithic",
  "influxdb",
  "oxide",
]
