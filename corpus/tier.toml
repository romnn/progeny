# The quick tier: the specs every pull request exercises in full.
#
# Model-level checks (round-trip, convergence, diagnostics snapshots, determinism) run over
# all 78 specs on every run because they are cheap. Compile-checking a generated crate is
# not cheap, so the expensive per-spec assertions run over this list on pull requests and
# over the whole corpus nightly and before a release. Nothing is sampled silently: the
# corpus runner prints what the tier skipped.
#
# Chosen from `notes` in manifest.toml so the eight cover both dialects, both serialization
# formats, and the constructs that break generators:
#
#   petstore-31   hermetic and committed — the one spec that needs no network
#   github-31     3.1, ~4 MB, the size ceiling
#   posthog       3.1, 925 patternProperties / 3743 anyOf / 198 const / prefixItems, and
#                 served as YAML from an extensionless URL cached as `.json`
#   cloudflare    3.0, very large, 29 self-contradicting example payloads
#   okta          3.0 YAML, 56 discriminators
#   orb           3.1, 2955 oneOf lines, 19 discriminators, null-heavy
#   jellyfin      3.0, 77 `format: binary` + octet-stream bodies
#   oxide         3.0, the predecessor's flagship consumer spec — regression protection
#
# Deliberately absent: `zendesk`, whose bare `=` scalar (a YAML 1.1 `!!value` tag) is
# covered by a loader unit test rather than by paying for a large spec, and `launchdarkly`,
# which is fetched live and can fail for reasons unrelated to progeny.
#
# One hole in the coverage, recorded rather than discovered later: CI compiles this tier
# through the derive strategy with `--except cloudflare`. Through the derive, `cloudflare`
# needs about 14.7 GiB for one rustc invocation and a hosted runner has 16 GB, of which
# roughly 14.5 GiB is usable — and a single compilation unit cannot be split across jobs, so
# no job count reaches it. Measured under a 14 GiB cgroup cap: the hand-written path peaks at
# 9.10 GiB and finishes, the derive is killed at the ceiling. `cloudflare` still compiles here
# through the default path, and still runs every cheaper gate through both strategies; what is
# untested is the derive rendering of the largest crate in the corpus, on this runner size.
quick = [
  "petstore-31",
  "github-31",
  "posthog",
  "cloudflare",
  "okta",
  "orb",
  "jellyfin",
  "oxide",
]
