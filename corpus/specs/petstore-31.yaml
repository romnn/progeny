openapi: "3.1.0"
info:
  title: Petstore
  version: "1.0"
  license:
    name: MIT
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createPets
      summary: Create a pet
      responses:
        "201":
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    get:
      operationId: showPetById
      summary: Info for a specific pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}/photo:
    post:
      operationId: uploadPetPhoto
      summary: Upload a photo for a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  description: The photo contents.
                  type: string
                  contentMediaType: image/png
                note:
                  description: A note stored with the photo.
                  type: string
                rating:
                  description: An optional numeric rating.
                  type: integer
                  format: int32
      responses:
        "201":
          description: Photo accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUpload"
  /typed-errors/{kind}:
    get:
      operationId: typedErrors
      summary: Return one of two errors with the same payload schema
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No error requested
        "404":
          description: Missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /download:
    get:
      operationId: downloadBytes
      summary: Download raw bytes
      responses:
        "200":
          description: Raw bytes
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
  /motd:
    get:
      operationId: downloadText
      summary: Download text
      responses:
        "200":
          description: Verbatim text
          content:
            text/plain:
              schema:
                type: string
  /rejection-probe/{id}:
    post:
      operationId: rejectionProbe
      summary: Exercise request rejection rendering
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: x-mode
          in: header
          required: true
          schema:
            type: string
        - name: session
          in: cookie
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "204":
          description: Request accepted
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
    Pets:
      type: array
      items:
        $ref: "#/components/schemas/Pet"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    PhotoUpload:
      type: object
      required:
        - petId
        - filename
        - contentType
        - fileSize
        - note
      properties:
        petId:
          type: integer
          format: int64
        filename:
          type: string
        contentType:
          type: string
        fileSize:
          type: integer
          format: int64
        note:
          type: string
        rating:
          type: integer
          format: int32
