# The one shape the hand-written serde path is spiked on: a plain struct with a required member,
# an optional one, and one whose wire name is not a Rust identifier. Small on purpose — the point
# of the spike is to find out whether the wire contract holds everything the buffered deserializer
# needs, and a bigger fixture would not answer that question any better.
#
# `Closed` is the same shape with undeclared members refused, so both unknown-member policies are
# exercised. `State` is a fieldless enum, which takes the no-buffering path.
openapi: 3.1.0
info:
  title: Spike
  version: "1.0"
paths:
  /spike:
    post:
      operationId: postSpike
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Spike"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spike"
  /tools:
    post:
      operationId: postTool
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tool"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
components:
  schemas:
    Spike:
      type: object
      required: [required]
      properties:
        required:
          type: string
        optional:
          type: integer
        clearable:
          type: [string, "null"]
        wireName:
          type: boolean
        limit:
          type: integer
          default: 20
        state:
          $ref: "#/components/schemas/State"
        # A fixed-arity member, which is the trailing-element bug class. The tuple's own
        # implementation is derived on both sides — the eligibility function rules tuples to the
        # derive — so what this exercises is the *buffered replay* around it: in hand-written mode
        # the struct buffers this member and replays it, and a replay that stops at the arity it was
        # asked for drops the rest without a word unless it checks.
        pair:
          type: array
          prefixItems:
            - type: integer
            - type: integer
    Closed:
      type: object
      required: [required]
      additionalProperties: false
      properties:
        required:
          type: string
        optional:
          type: integer
    # `unknown` is declared so its variant has to step aside for the fallback's name.
    State:
      type: string
      enum: [in-progress, done, unknown]
    # An object with no properties, which `cloudflare`, `github-31` and `okta` all declare. It is
    # here because it renders to code with nothing in it — no member to read, none to write — and
    # every binding that had nothing to do became a warning in the consumer's build: an unused
    # `buffer`, a `mut` on a count nothing increments, a `mut` on a state nothing writes to.
    Empty:
      type: object
      properties: {}
    # A union whose branches name themselves by `type`, the way anthropic's tool list does: the
    # search tool lists a dated name and an alias, a payload without `type` is the custom tool,
    # and one whose `type` is `null` is the nullish tool.
    # The alias comes first, so a route is a position among every spelling rather than a branch's
    # index.
    Tool:
      oneOf:
        - $ref: "#/components/schemas/SearchTool"
        - $ref: "#/components/schemas/CustomTool"
        - $ref: "#/components/schemas/NullishTool"
        - $ref: "#/components/schemas/BashTool"
    SearchTool:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [search_v2, search]
        name:
          type: string
    CustomTool:
      type: object
      required: [name]
      properties:
        type:
          type: string
          const: custom
        name:
          type: string
    NullishTool:
      type: object
      required: [type, name]
      properties:
        type:
          type: [string, "null"]
          enum: [nullish, null]
        name:
          type: string
    BashTool:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          const: bash
        name:
          type: string
    # A member and a value named by `gen`, which edition 2024 reserves, so the generated names
    # have to escape it.
    Keywords:
      type: object
      properties:
        gen:
          type: string
        kind:
          type: string
          enum: [gen, async]
    # Members declared beside an `anyOf` that no branch names, as `schemars` exports a struct with
    # a `#[serde(flatten)]` enum member: a struct whose union reads the members it leaves.
    ImageUserInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [image]
        detail:
          type: string
      anyOf:
        - type: object
          required: [url]
          properties:
            url:
              type: string
        - type: object
          required: [fileId]
          properties:
            fileId:
              type: string
    # The same beside a `oneOf` of closed branches with two members each, which shape decides.
    Located:
      type: object
      properties:
        label:
          type: string
      oneOf:
        - type: object
          required: [lat, lon]
          additionalProperties: false
          properties:
            lat:
              type: number
            lon:
              type: number
        - type: object
          required: [street, city]
          additionalProperties: false
          properties:
            street:
              type: string
            city:
              type: string
