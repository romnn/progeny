# The one shape the hand-written serde path is spiked on: a plain struct with a required member,
# an optional one, and one whose wire name is not a Rust identifier. Small on purpose — the point
# of the spike is to find out whether the wire contract holds everything the buffered deserializer
# needs, and a bigger fixture would not answer that question any better.
#
# `Closed` is the same shape with undeclared members refused, so both unknown-member policies are
# exercised. `State` is a fieldless enum, which takes the no-buffering path.
openapi: 3.1.0
info:
  title: Spike
  version: "1.0"
paths:
  /spike:
    post:
      operationId: postSpike
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Spike"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spike"
components:
  schemas:
    Spike:
      type: object
      required: [required]
      properties:
        required:
          type: string
        optional:
          type: integer
        clearable:
          type: [string, "null"]
        wireName:
          type: boolean
        limit:
          type: integer
          default: 20
        state:
          $ref: "#/components/schemas/State"
        # A fixed-arity member, which is the trailing-element bug class. The tuple's own
        # implementation is derived on both sides — the eligibility function rules tuples to the
        # derive — so what this exercises is the *buffered replay* around it: in hand-written mode
        # the struct buffers this member and replays it, and a replay that stops at the arity it was
        # asked for drops the rest without a word unless it checks.
        pair:
          type: array
          prefixItems:
            - type: integer
            - type: integer
    Closed:
      type: object
      required: [required]
      additionalProperties: false
      properties:
        required:
          type: string
        optional:
          type: integer
    State:
      type: string
      enum: [in-progress, done]
    # An object with no properties, which `cloudflare`, `github-31` and `okta` all declare. It is
    # here because it renders to code with nothing in it — no member to read, none to write — and
    # every binding that had nothing to do became a warning in the consumer's build: an unused
    # `buffer`, a `mut` on a count nothing increments, a `mut` on a state nothing writes to.
    Empty:
      type: object
      properties: {}
