# The one shape the hand-written serde path is spiked on: a plain struct with a required member,
# an optional one, and one whose wire name is not a Rust identifier. Small on purpose — the point
# of the spike is to find out whether the wire contract holds everything the buffered deserializer
# needs, and a bigger fixture would not answer that question any better.
#
# `Closed` is the same shape with undeclared members refused, so both unknown-member policies are
# exercised. `State` is a fieldless enum, which takes the no-buffering path.
openapi: 3.1.0
info:
  title: Spike
  version: "1.0"
paths:
  /spike:
    post:
      operationId: postSpike
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Spike"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spike"
  /tools:
    post:
      operationId: postTool
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tool"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
  /logs:
    post:
      operationId: postLogExport
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogExport"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogExport"
  /channels:
    post:
      operationId: postChannel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Channel"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChannel"
  /maybe:
    post:
      operationId: postMaybe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaybeHolder"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaybeHolder"
  /detections:
    post:
      operationId: postDetection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Detection"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detection"
  /notes:
    post:
      operationId: postNotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotePost"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteBoard"
  /chapters:
    post:
      operationId: postChapter
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Chapter"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
  /tuples:
    post:
      operationId: postTuples
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tuples"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tuples"
components:
  schemas:
    Spike:
      type: object
      required: [required]
      properties:
        required:
          type: string
        optional:
          type: integer
        clearable:
          type: [string, "null"]
        wireName:
          type: boolean
        limit:
          type: integer
          default: 20
        state:
          $ref: "#/components/schemas/State"
        # A fixed-arity member, which is the trailing-element bug class. The tuple's own
        # implementation is derived on both sides — the eligibility function rules tuples to the
        # derive — so what this exercises is the *buffered replay* around it: in hand-written mode
        # the struct buffers this member and replays it, and a replay that stops at the arity it was
        # asked for drops the rest without a word unless it checks.
        pair:
          type: array
          prefixItems:
            - type: integer
            - type: integer
    Closed:
      type: object
      required: [required]
      additionalProperties: false
      properties:
        required:
          type: string
        optional:
          type: integer
    # `unknown` is declared so its variant has to step aside for the fallback's name.
    State:
      type: string
      enum: [in-progress, done, unknown]
    # An object with no properties, which `cloudflare`, `github-31` and `okta` all declare. It is
    # here because it renders to code with nothing in it — no member to read, none to write — and
    # every binding that had nothing to do became a warning in the consumer's build: an unused
    # `buffer`, a `mut` on a count nothing increments, a `mut` on a state nothing writes to.
    Empty:
      type: object
      properties: {}
    # A union whose branches name themselves by `type`, the way anthropic's tool list does: the
    # search tool lists a dated name and an alias, a payload without `type` is the custom tool,
    # and one whose `type` is `null` is the nullish tool.
    # The alias comes first, so a route is a position among every spelling rather than a branch's
    # index.
    Tool:
      oneOf:
        - $ref: "#/components/schemas/SearchTool"
        - $ref: "#/components/schemas/CustomTool"
        - $ref: "#/components/schemas/NullishTool"
        - $ref: "#/components/schemas/BashTool"
    SearchTool:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [search_v2, search]
        name:
          type: string
    CustomTool:
      type: object
      required: [name]
      properties:
        type:
          type: string
          const: custom
        name:
          type: string
    NullishTool:
      type: object
      required: [type, name]
      properties:
        type:
          type: [string, "null"]
          enum: [nullish, null]
        name:
          type: string
    BashTool:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          const: bash
        name:
          type: string
    # A member and a value named by `gen`, which edition 2024 reserves, so the generated names
    # have to escape it.
    Keywords:
      type: object
      properties:
        gen:
          type: string
        kind:
          type: string
          enum: [gen, async]
    # Members declared beside an `anyOf` that no branch names, as `schemars` exports a struct with
    # a `#[serde(flatten)]` enum member: a struct whose union reads the members it leaves.
    ImageUserInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [image]
        detail:
          type: string
      anyOf:
        - type: object
          required: [url]
          properties:
            url:
              type: string
        - type: object
          required: [fileId]
          properties:
            fileId:
              type: string
    # The same beside a `oneOf` of closed branches with two members each, which shape decides.
    Located:
      type: object
      properties:
        label:
          type: string
      oneOf:
        - type: object
          required: [lat, lon]
          additionalProperties: false
          properties:
            lat:
              type: number
            lon:
              type: number
        - type: object
          required: [street, city]
          additionalProperties: false
          properties:
            street:
              type: string
            city:
              type: string
    # A union whose branches name themselves by a constant, one of them a struct with a union
    # flattened beside its members, as agentmux's codex schema writes its `UserInput`.
    UserInput:
      oneOf:
        - $ref: "#/components/schemas/TextInput"
        - $ref: "#/components/schemas/ImageInput"
        - $ref: "#/components/schemas/AudioInput"
    TextInput:
      type: object
      required: [text, type]
      properties:
        text:
          type: string
        type:
          type: string
          enum: [text]
    ImageInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [image]
        detail:
          type: string
      anyOf:
        - type: object
          required: [uri]
          properties:
            uri:
              type: string
        - type: object
          required: [blob]
          properties:
            blob:
              type: string
    AudioInput:
      type: object
      required: [path, type]
      properties:
        path:
          type: string
        type:
          type: string
          enum: [localAudio]
    # Branches told apart one level down, by a shared member whose closed objects each require a
    # member the other lacks.
    MultiSelect:
      anyOf:
        - $ref: "#/components/schemas/UntitledMultiSelect"
        - $ref: "#/components/schemas/TitledMultiSelect"
    UntitledMultiSelect:
      type: object
      required: [items]
      properties:
        items:
          $ref: "#/components/schemas/UntitledItems"
    TitledMultiSelect:
      type: object
      required: [items]
      properties:
        items:
          $ref: "#/components/schemas/TitledItems"
    UntitledItems:
      type: object
      additionalProperties: false
      required: [enum]
      properties:
        enum:
          type: array
          items:
            type: string
    TitledItems:
      type: object
      additionalProperties: false
      required: [anyOf]
      properties:
        anyOf:
          type: array
          items:
            type: string
    # A closed earlier branch that reads what it accepts whole, before a later one it overlaps.
    EnumSchema:
      anyOf:
        - $ref: "#/components/schemas/UntitledEnum"
        - $ref: "#/components/schemas/LegacyEnum"
    UntitledEnum:
      type: object
      additionalProperties: false
      required: [enum]
      properties:
        enum:
          type: array
          items:
            type: string
    LegacyEnum:
      type: object
      additionalProperties: false
      required: [enum]
      properties:
        enum:
          type: array
          items:
            type: string
        enumNames:
          type: array
          items:
            type: string
    # An object branch before a list branch, which a struct that also read a sequence by position
    # took the list from.
    Either:
      oneOf:
        - type: object
          required: [name]
          properties:
            name:
              type: string
        - type: array
          items:
            type: string
    # A union of itself and `null`, whose one finite value is `null`, held directly and through
    # an alias by required members, beside an alias of a nullable list of itself, which is
    # recursive and so becomes a newtype. The required string gives the holder a read form of its
    # own, so every member is read by its twin.
    Maybe:
      oneOf:
        - $ref: "#/components/schemas/Maybe"
        - type: "null"
    MaybeAlias:
      oneOf:
        - $ref: "#/components/schemas/Maybe"
    Nest:
      oneOf:
        - $ref: "#/components/schemas/NestList"
    NestList:
      type: [array, "null"]
      items:
        $ref: "#/components/schemas/Nest"
    MaybeHolder:
      type: object
      required: [a, b, c, label]
      properties:
        a:
          $ref: "#/components/schemas/Maybe"
        b:
          $ref: "#/components/schemas/MaybeAlias"
        c:
          $ref: "#/components/schemas/Nest"
        label:
          type: string
    # A base listing its one subtype, which extends it through `allOf`, tagged by `type`: the
    # base is a union of the subtype by that tag, and the subtype a struct of both their members.
    # Nothing uses the subtype but the union, so the union consumes the tag.
    LogExport:
      type: object
      required: [type, logTypes]
      properties:
        type:
          type: string
          enum: [OTEL]
        logTypes:
          type: array
          items:
            type: string
      discriminator:
        propertyName: type
        mapping:
          OTEL: "#/components/schemas/OtelLogExport"
      oneOf:
        - $ref: "#/components/schemas/OtelLogExport"
    OtelLogExport:
      allOf:
        - $ref: "#/components/schemas/LogExport"
        - type: object
          required: [endpoint]
          properties:
            endpoint:
              type: string
    # The same family whose subtype a response also carries on its own, where the tag is on the
    # wire, so the union leaves the tag on the subtype and carries it.
    Channel:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
        label:
          type: string
      discriminator:
        propertyName: kind
        mapping:
          email: "#/components/schemas/EmailChannel"
      oneOf:
        - $ref: "#/components/schemas/EmailChannel"
    EmailChannel:
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          required: [address]
          properties:
            address:
              type: string
    # Members beside a union one of whose branches is itself members beside a union, as
    # `schemars` exports a flattened enum one of whose variants flattens another (#167).
    ThreadItem:
      type: object
      properties:
        startedAtMs:
          type: [integer, "null"]
          format: int64
      oneOf:
        - title: TextThreadItem
          type: object
          required: [type, text]
          properties:
            type:
              type: string
              enum: [text]
            text:
              type: string
        - title: ImageThreadItem
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [image]
          anyOf:
            - title: ImageFileId
              type: object
              required: [fileId]
              properties:
                fileId:
                  type: string
            - title: ImageResult
              type: object
              required: [result]
              properties:
                result:
                  type: string
    # A string beside objects that each require `provider` with a value of their own, as vapi's
    # voicemail detection is written: a string is the string branch, and an object the branch its
    # `provider` names.
    # Nothing else takes `provider` off the objects, so they keep it and the union carries it.
    Detection:
      oneOf:
        - type: string
          enum: ["off"]
        - $ref: "#/components/schemas/GoogleDetection"
        - $ref: "#/components/schemas/VapiDetection"
    GoogleDetection:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [google]
        model:
          type: string
    VapiDetection:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [vapi]
        model:
          type: string
    # The same optional-only struct twice: `Note` only a response reaches, and `SharedNote` a
    # request sends too. Both read forms keep what the description does not declare, so both are
    # read forms of their own, and the request's strict `SharedNote` writes no capture map.
    # `SharedNotes` differs only through the struct it lists, and `NoteStatus` is a union whose
    # `idle` branch carries only the tag it consumes.
    Note:
      type: object
      properties:
        text:
          type: string
    SharedNote:
      type: object
      properties:
        text:
          type: string
    SharedNotes:
      type: array
      items:
        $ref: "#/components/schemas/SharedNote"
    NoteStatus:
      oneOf:
        - title: IdleNoteStatus
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [idle]
        - title: BusyNoteStatus
          type: object
          required: [state, since]
          properties:
            state:
              type: string
              enum: [busy]
            since:
              type: integer
    NotePost:
      type: object
      properties:
        note:
          $ref: "#/components/schemas/SharedNote"
        notes:
          $ref: "#/components/schemas/SharedNotes"
        status:
          $ref: "#/components/schemas/NoteStatus"
    NoteBoard:
      type: object
      properties:
        read:
          $ref: "#/components/schemas/Note"
        note:
          $ref: "#/components/schemas/SharedNote"
        notes:
          $ref: "#/components/schemas/SharedNotes"
        status:
          $ref: "#/components/schemas/NoteStatus"
    # A cycle through two struct members and a union: `Chapter` holds an optional `Section`, which
    # holds an optional `Passage`, a union whose object branch is `Chapter`.
    # The union's payload is already boxed, so no member on the cycle is, and `Chapter`, whose name
    # sorts first, is where a member would be boxed otherwise.
    # A request sends it and a response reads it, so it has strict and read forms.
    Chapter:
      type: object
      required: [title]
      properties:
        title:
          type: string
        section:
          $ref: "#/components/schemas/Section"
    Section:
      type: object
      properties:
        body:
          $ref: "#/components/schemas/Passage"
    Passage:
      oneOf:
        - $ref: "#/components/schemas/Chapter"
        - type: string
    # Positional arrays at the arities where the Rust representation changes, each named with
    # integers and inline with strings, so that no inline one is the same type as a named one.
    # One position is `(T,)`, which a named type wraps because a one-member tuple struct is serde's
    # newtype and would write its member bare.
    # Past 12 positions an inline tuple is named, because Rust implements `Debug` for tuples only
    # up to 12 elements.
    # Past 16, where serde stops implementing tuples, it is arbitrary JSON.
    Tuples:
      type: object
      properties:
        one:
          $ref: "#/components/schemas/One"
        oneInline:
          type: array
          prefixItems: [{type: string}]
        twelve:
          $ref: "#/components/schemas/Twelve"
        twelveInline:
          type: array
          prefixItems: [
            {type: string}, {type: string}, {type: string}, {type: string},
            {type: string}, {type: string}, {type: string}, {type: string},
            {type: string}, {type: string}, {type: string}, {type: string}]
        thirteen:
          $ref: "#/components/schemas/Thirteen"
        thirteenInline:
          type: array
          prefixItems: [
            {type: string}, {type: string}, {type: string}, {type: string},
            {type: string}, {type: string}, {type: string}, {type: string},
            {type: string}, {type: string}, {type: string}, {type: string},
            {type: string}]
        sixteen:
          $ref: "#/components/schemas/Sixteen"
        sixteenInline:
          type: array
          prefixItems: [
            {type: string}, {type: string}, {type: string}, {type: string},
            {type: string}, {type: string}, {type: string}, {type: string},
            {type: string}, {type: string}, {type: string}, {type: string},
            {type: string}, {type: string}, {type: string}, {type: string}]
        seventeen:
          $ref: "#/components/schemas/Seventeen"
        seventeenInline:
          type: array
          prefixItems: [
            {type: string}, {type: string}, {type: string}, {type: string},
            {type: string}, {type: string}, {type: string}, {type: string},
            {type: string}, {type: string}, {type: string}, {type: string},
            {type: string}, {type: string}, {type: string}, {type: string},
            {type: string}]
    One:
      type: array
      prefixItems: [{type: integer}]
    Twelve:
      type: array
      prefixItems: [
        {type: integer}, {type: integer}, {type: integer}, {type: integer},
        {type: integer}, {type: integer}, {type: integer}, {type: integer},
        {type: integer}, {type: integer}, {type: integer}, {type: integer}]
    Thirteen:
      type: array
      prefixItems: [
        {type: integer}, {type: integer}, {type: integer}, {type: integer},
        {type: integer}, {type: integer}, {type: integer}, {type: integer},
        {type: integer}, {type: integer}, {type: integer}, {type: integer},
        {type: integer}]
    Sixteen:
      type: array
      prefixItems: [
        {type: integer}, {type: integer}, {type: integer}, {type: integer},
        {type: integer}, {type: integer}, {type: integer}, {type: integer},
        {type: integer}, {type: integer}, {type: integer}, {type: integer},
        {type: integer}, {type: integer}, {type: integer}, {type: integer}]
    Seventeen:
      type: array
      prefixItems: [
        {type: integer}, {type: integer}, {type: integer}, {type: integer},
        {type: integer}, {type: integer}, {type: integer}, {type: integer},
        {type: integer}, {type: integer}, {type: integer}, {type: integer},
        {type: integer}, {type: integer}, {type: integer}, {type: integer},
        {type: integer}]
