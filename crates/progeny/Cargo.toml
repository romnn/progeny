[package]
name = "progeny"
description = "Generate a Rust client and server from an OpenAPI description, faithfully and loudly"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# The front end exposed for the conformance corpus runner and the fuzz targets. Not public
# API: no semver, no stability, and never enabled by a consumer of the generator.
harness = []

[dependencies]
camino.workspace = true
heck.workspace = true
indoc.workspace = true
libyaml-safer.workspace = true
matchit.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
thiserror.workspace = true
# `Config` is what a `progeny.toml` deserializes into. Only the `progeny` binary and the
# configuration's own tests read TOML; the library itself never touches a file.
toml.workspace = true

[dev-dependencies]
# Two jobs. One test asserts that the `matchit` progeny asks is the `matchit` axum will use — a
# version skew there is a generated server that panics at startup, which is the failure the
# classifier exists to make impossible. And with `reqwest`, the shipped support files that name an
# HTTP crate (`support/http.rs`, `support/router.rs`) compile as part of progeny's own test build,
# so the property the support module is arranged around — the file progeny tests is the file it
# ships — holds with no exceptions rather than with two.
axum.workspace = true
color-eyre.workspace = true
reqwest.workspace = true
test-util.workspace = true

[lints]
workspace = true
